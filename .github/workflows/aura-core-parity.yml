name: Aura core parity build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aura-core-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Aura wrapper
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Aura wrapper dependencies
        run: npm ci
      # The Aura repository is a thin build wrapper; application TypeScript lives in the pinned V10 core.
      # npm run build performs the authoritative TypeScript/build checks inside that source checkout.
      - name: Build Aura with pinned V10 core
        run: npm run build
      - name: Verify pinned core and bundled artifacts
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA="$(tr -d '[:space:]' < .invista-core-source)"
          MAIN_SHA="$(git ls-remote https://github.com/SkelleTu/InvistaPro-V10.git refs/heads/main | awk '{print $1}')"
          test -n "$CORE_SHA"
          test "$CORE_SHA" = "$MAIN_SHA"
          test -s dist/index.js
          test -s dist/trading-user-worker.js
