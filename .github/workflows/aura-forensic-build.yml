name: Aura forensic build
# forensic validation workflow

concurrency:
  group: aura-forensic-build
  cancel-in-progress: true

on:
  push:
    branches:
      - forensic-observability-2026-10-05
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout forensic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Aura from pinned canonical revision
        env:
          CANONICAL_INVISTA_COMMIT: fee33e023abf18fae2d8585f9379c0e315d420d4
        run: npm run build

      - name: Verify canonical revision and forensic manifest
        env:
          EXPECTED_CANONICAL_COMMIT: fee33e023abf18fae2d8585f9379c0e315d420d4
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/forensic-manifest.json', 'utf8'));
          if (manifest.canonicalSourceCommit !== process.env.EXPECTED_CANONICAL_COMMIT) {
            throw new Error('Canonical source revision mismatch: ' + manifest.canonicalSourceCommit);
          }
          if (!Number.isInteger(manifest.totalFiles) || manifest.totalFiles <= 0) {
            throw new Error('Invalid forensic manifest file count');
          }
          if (manifest.analyzedFiles < 1 || manifest.analyzedFiles > manifest.totalFiles) {
            throw new Error('Invalid forensic manifest analyzed file count');
          }
          console.log(JSON.stringify({
            canonicalSourceCommit: manifest.canonicalSourceCommit,
            totalFiles: manifest.totalFiles,
            analyzedFiles: manifest.analyzedFiles
          }, null, 2));
          NODE

      - name: Validate complete manifest integrity
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('dist/forensic-manifest.json', 'utf8'));
          if (!Array.isArray(m.files)) throw new Error('Manifest entries missing');
          if (m.files.length !== m.totalFiles) throw new Error('Manifest count mismatch');
          const paths = new Set(m.files.map(e => e.path));
          if (paths.size !== m.files.length) throw new Error('Duplicate manifest paths detected');
          for (const e of m.files) {
            if (!e.path || !Number.isInteger(e.size) || e.size < 0 || !/^[a-f0-9]{64}$/i.test(e.sha256)) throw new Error('Invalid manifest entry: ' + JSON.stringify(e));
          }
          const hashes = new Map();
          for (const e of m.files) hashes.set(e.sha256, (hashes.get(e.sha256) || 0) + 1);
          const duplicateContent = [...hashes.values()].filter(n => n > 1).length;
          console.log(JSON.stringify({ totalFiles:m.totalFiles, analyzedFiles:m.analyzedFiles, uniquePaths:paths.size, duplicateContentHashes:duplicateContent }, null, 2));
          NODE

      - name: TypeScript check on canonical source
        env:
          CANONICAL_INVISTA_COMMIT: fee33e023abf18fae2d8585f9379c0e315d420d4
        run: |
          test -f /tmp/invista-source/package.json
          test "$(git -C /tmp/invista-source rev-parse HEAD)" = "$CANONICAL_INVISTA_COMMIT"
          cd /tmp/invista-source
          npm run check
