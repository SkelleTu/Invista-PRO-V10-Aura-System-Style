name: Validate canonical Invista core reference

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Aura System Style
        uses: actions/checkout@v4
      - name: Validate reviewed canonical core SHA
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA="$(git ls-remote https://github.com/SkelleTu/InvistaPro-V10.git refs/heads/main | awk '{print $1}')"
          MARKER="$(tr -d '[:space:]' < .invista-core-source)"
          test -n "$CORE_SHA"
          if [ "$MARKER" != "$CORE_SHA" ]; then
            echo "::error::Canonical Invista core changed. Update .invista-core-source through a reviewed change before building Aura."
            echo "Recorded core: $MARKER"
            echo "Current core:  $CORE_SHA"
            exit 1
          fi
          grep -q 'https://github.com/SkelleTu/InvistaPro-V10.git' package.json
          grep -q 'node aura-build.mjs' package.json
          echo "Canonical core reference is current and validated."
