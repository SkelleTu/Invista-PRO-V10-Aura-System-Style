name: Deriv Account Architecture Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deriv-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Aura
        uses: actions/checkout@v4

      - name: Checkout canonical Invista core
        uses: actions/checkout@v4
        with:
          repository: SkelleTu/InvistaPro-V10
          path: invista-core

      - name: Validate Aura and Core Deriv architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 - <<'PY'
          from pathlib import Path
          def source(root):
              return "\n".join(p.read_text(errors="ignore") for p in Path(root).rglob("*") if p.is_file() and p.suffix in {".ts",".tsx",".js",".jsx",".mjs",".cjs"} and "node_modules" not in p.parts and ".git" not in p.parts and "dist" not in p.parts)
          aura=source(".")
          core=source("invista-core")
          required=["api.derivws.com","/otp","accountId","accountType","demo","real"]
          forbidden=["ws.derivws.com/websockets/v3","ws.binaryws.com/websockets/v3","authorize:"]
          missing_aura=[x for x in required if x not in aura]
          missing_core=[x for x in required if x not in core]
          bad_aura=[x for x in forbidden if x in aura]
          bad_core=[x for x in forbidden if x in core]
          report=f"# Aura/Core Deriv Architecture\n\nAura missing: {missing_aura}\nCore missing: {missing_core}\nAura legacy: {bad_aura}\nCore legacy: {bad_core}\n"
          Path("audit-artifacts/deriv-aura-core-report.md").write_text(report)
          print(report)
          if missing_aura or missing_core or bad_aura or bad_core:
              raise SystemExit(1)
          PY

      - name: Canonical core TypeScript validation
        working-directory: invista-core
        run: |
          npm ci --ignore-scripts --no-audit
          npm exec -- tsc --noEmit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-aura-account-audit-report
          path: audit-artifacts/
