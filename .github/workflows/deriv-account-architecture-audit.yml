name: Deriv Account Architecture Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deriv-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Aura
        uses: actions/checkout@v4

      - name: Read reviewed canonical core SHA
        shell: bash
        run: echo "INVISTA_CORE_SHA=$(tr -d '[:space:]' < .invista-core-source)" >> "$GITHUB_ENV"

      - name: Checkout reviewed canonical Invista core
        uses: actions/checkout@v4
        with:
          repository: SkelleTu/InvistaPro-V10
          ref: ${{ env.INVISTA_CORE_SHA }}
          path: invista-core

      - name: Validate Aura/Core Deriv architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 - <<'PY'
          from pathlib import Path
          core=Path("invista-core/server/services/deriv-account-gateway.ts").read_text()
          service=Path("invista-core/server/services/deriv-api.ts").read_text()
          package_json=Path("package.json").read_text()
          required=["api.derivws.com","/otp","accountId","accountType","demo","real","Deriv-App-ID","Authorization"]
          missing=[x for x in required if x not in core]
          forbidden=[x for x in ["ws.derivws.com/websockets/v3","ws.binaryws.com/websockets/v3","authorize:"] if x in service]
          aura_reference_ok=("InvistaPro-V10" in package_json and "aura-build.mjs" in package_json)
          report=f"# Aura/Core Deriv Architecture\n\nCore gateway missing: {missing}\nCore legacy markers: {forbidden}\nAura canonical-core reference: {aura_reference_ok}\n"
          Path("audit-artifacts/deriv-aura-core-report.md").write_text(report)
          print(report)
          if missing or forbidden or not aura_reference_ok:
              raise SystemExit(1)
          PY

      - name: Canonical core TypeScript validation
        working-directory: invista-core
        run: |
          npm ci --ignore-scripts --no-audit
          npm exec -- tsc --noEmit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-aura-account-audit-report
          path: audit-artifacts/
