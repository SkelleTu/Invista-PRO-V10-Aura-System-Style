name: Aura Style Parity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical core reference
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA="$(git ls-remote https://github.com/SkelleTu/InvistaPro-V10.git refs/heads/main | awk '{print $1}')"
          test -n "$CORE_SHA"
          test "$(tr -d '[:space:]' < .invista-core-source)" = "$CORE_SHA"

      - name: Install Aura dependencies
        run: npm ci

      - name: Prepare canonical Invista source
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.invista-core-source")"
          test -n "$CORE_SHA"
          rm -rf /tmp/invista-source
          git clone --depth 1 https://github.com/SkelleTu/InvistaPro-V10.git /tmp/invista-source
          git -C /tmp/invista-source fetch --depth 1 origin "$CORE_SHA"
          git -C /tmp/invista-source checkout --detach FETCH_HEAD
          cp -a aura-assets aura-build.mjs /tmp/invista-source/
          cd /tmp/invista-source
          node aura-build.mjs
          npm install --include=dev --production=false

      - name: Enforce presentation-only Aura delta
        working-directory: /tmp/invista-source
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED='^(client/src/App\.tsx|client/src/index\.css|client/src/pages/auth-page\.tsx|client/src/components/AuraVisualLayer\.tsx|client/src/aura-system\.css)$'
          rm -rf aura-assets aura-build.mjs
          CHANGED="$(git status --short | sed -E 's/^.. //')"
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | while IFS= read -r file; do
              if ! printf '%s\n' "$file" | grep -Eq "$ALLOWED"; then
                echo "ERROR: Aura build changed non-visual canonical file: $file"
                exit 1
              fi
            done
          fi
          echo "OK: Aura build changes presentation files only."

      - name: Typecheck canonical Aura source
        working-directory: /tmp/invista-source
        run: npm exec -- tsc --noEmit

      - name: Build canonical Aura source
        working-directory: /tmp/invista-source
        run: |
          npm exec -- vite@5.4.19 build
          npm exec -- esbuild@0.25.0 server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist

      - name: Verify Aura artifact
        working-directory: /tmp/invista-source
        run: |
          test -s dist/index.js
          test -s dist/public/index.html
