name: Repair Aura npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package-lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --include=dev --ignore-scripts --no-audit
          npm ci --include=dev --ignore-scripts --no-audit
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "package-lock.json already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: synchronize Aura npm lockfile"
          git push
