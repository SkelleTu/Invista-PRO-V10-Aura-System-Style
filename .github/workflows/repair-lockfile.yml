name: Validate Aura npm lockfile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify package-lock consistency without rewriting it
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts --no-audit
          npm install --package-lock-only --include=dev --ignore-scripts --no-audit
          git diff --exit-code -- package-lock.json package.json
          echo "Aura package-lock.json is consistent. No automatic commit was made."
